name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Run every Node leg even if one fails, so a single version's failure
      # doesn't hide the others.
      fail-fast: false
      matrix:
        # Active/maintenance LTS lines only — no Current/odd (experimental) majors.
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Version comes from the root package.json `packageManager` field, so CI,
      # release, and local dev all resolve to the same pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the unit tests
        run: pnpm test

      # The web app and the packages it builds from. The build needs a database
      # URL to exist, not to answer: every route that reads it is dynamic.
      - name: Lint, type-check, and build the web app
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm exec turbo run lint check-types build --filter=web

  e2e:
    name: End-to-end (accessibility, keyboard, performance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @biga/e2e install-browser

      # The server URL is read at build time for the /api rewrites and at run
      # time for the session preflight, and points at the fixture server the
      # tests start.
      - name: Build the web app against the fixture server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BIGA_SERVER_URL: http://localhost:8080
        run: pnpm --filter web build

      - name: Run the end-to-end tests
        run: pnpm --filter @biga/e2e e2e

      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: packages/e2e/test-results
          retention-days: 7
